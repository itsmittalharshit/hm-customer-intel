[project]
name = "hmci"
version = "0.1.0"
description = "Customer Retention & Churn Intelligence Platform on the H&M dataset"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pandera>=0.20",
    "matplotlib>=3.8",
    "kaggle>=1.6",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "shap>=0.51.0",
    "statsmodels>=0.15.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
