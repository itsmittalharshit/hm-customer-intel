project:
  name: hmci
  seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  warehouse: data/warehouse.duckdb
  reports: reports

kaggle:
  competition: h-and-m-personalized-fashion-recommendations
  files:
    - articles.csv
    - customers.csv
    - transactions_train.csv

data:
  start_date: "2018-09-20"
  end_date: "2020-09-22"
  dev_sample_frac: 0.10
  dev_last_weeks: 26
  churn_window_weeks: 18
  active_lookback_weeks: 26
  snapshot_step_weeks: 4

churn_business:
  save_rate: 0.20          # assumed share of would-be churners an offer retains
  offer_cost_share: 0.05   # offer cost as a share of mean 26-week customer spend
  save_rate_grid: [0.05, 0.10, 0.20, 0.30]
  offer_cost_grid: [0.02, 0.05, 0.10, 0.20]

ab_test:
  baseline_retention: 0.60     # retention among EV-targeted customers on the test snapshot (1 - 0.397)
  alpha: 0.05
  power: 0.80
  mde_grid: [0.01, 0.02, 0.03, 0.05]
  chosen_mde: 0.02             # smallest uplift worth detecting (2 percentage points)
  simulated_true_uplift: 0.03  # used ONLY to demonstrate the analysis on simulated data